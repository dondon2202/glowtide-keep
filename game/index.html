<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glowtide Keep</title>
<meta name="description" content="Glowtide Keep: hold the light through five waves of the Gloom. An original canvas game that plays offline.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="wrap">
  <canvas id="game" width="960" height="600" aria-label="Glowtide Keep game canvas"></canvas>

</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
